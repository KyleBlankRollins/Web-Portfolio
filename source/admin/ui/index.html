<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Blog Admin - Post Management</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f5f5;
        color: #333;
        padding: 2rem;
      }

      header {
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: #666;
        font-size: 0.875rem;
      }

      #app {
        max-width: 1400px;
        margin: 0 auto;
      }

      .loading {
        text-align: center;
        padding: 4rem;
        color: #666;
      }

      .error {
        background: #fee;
        border: 1px solid #fcc;
        border-radius: 4px;
        padding: 1rem;
        color: #c33;
        margin: 1rem 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>📝 Blog Post Admin</h1>
        <p class="subtitle">
          Manage your blog post backlog - drag and drop to change
          status
        </p>
      </header>

      <div class="loading">Loading admin interface...</div>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
