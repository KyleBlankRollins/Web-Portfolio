<!doctype html>
<html lang="en">
  <head>
    <template data-kbr-include="partials/head.html"></template>
    <template data-kbr-assets="head"></template>
  </head>
  <body>
    <template data-kbr-include="partials/header.html"></template>
    <!-- One column, nothing beside it. The table of contents, series rail
         and tags used to sit in a sidebar at the same visual weight as the
         article; they now sit in the reading order - contents collapsed
         under the title, tags after the text - so the page is the text. -->
    <main class="blog-post-layout">
      <article class="blog-post-content">
        <h1 id="{{titleAnchorId}}">{{title}}</h1>
        <template data-kbr-include="partials/blog-metadata.html"></template>
        <template data-kbr-if="series">
          <template data-kbr-include="partials/post-series.html"></template>
        </template>
        <!-- Sticky masthead: the contents bar sticks to the top of the
             viewport, and once it is stuck (the sentinel above it has
             scrolled away) a compact copy of the title fades in beside the
             toggle. post-masthead.ts flips the attribute. -->
        <div data-post-masthead-sentinel aria-hidden="true"></div>
        <kbr-table-of-contents
          collapsible
          class="post-masthead"
          data-post-masthead
        >
          <p slot="leading" class="post-masthead-title" aria-hidden="true">
            {{title}}
          </p>
        </kbr-table-of-contents>
        <template data-kbr-slot="content"></template>
        <template data-kbr-if="supplements">
          <template data-kbr-include="partials/supplement-list.html"></template>
        </template>
        <template data-kbr-include="partials/blog-tags.html"></template>
        <template data-kbr-include="partials/blog-citations.html"></template>

        <kbr-anchor-copy></kbr-anchor-copy>
      </article>
    </main>
    <template data-kbr-include="partials/footer.html"></template>
    <template data-kbr-assets="body"></template>
  </body>
</html>
