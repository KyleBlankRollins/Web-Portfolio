<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  {{#description}}
  <meta name="description"
        content="{{description}}" />
  {{/description}}
  {{#keywords}}
  <meta name="keywords"
        content="{{keywords}}" />
  {{/keywords}}
  {{#additionalHead}}
  {{{additionalHead}}}
  {{/additionalHead}}
</head>

<body>
  <kbr-navigation></kbr-navigation>

  <main class="blog-post-layout">
    <aside class="blog-toc-sidebar">
      <kbr-table-of-contents></kbr-table-of-contents>
    </aside>

    <article class="blog-post-content">
      {{{content}}}
      <kbr-anchor-copy></kbr-anchor-copy>
    </article>
  </main>

  <script type="module"
          src="/main.ts"></script>
</body>

</html>
