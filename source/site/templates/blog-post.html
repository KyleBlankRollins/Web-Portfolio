<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    {{#description}}
    <meta name="description" content="{{description}}" />
    {{/description}} {{#keywords}}
    <meta name="keywords" content="{{keywords}}" />
    {{/keywords}} {{#additionalHead}} {{{additionalHead}}} {{/additionalHead}}
  </head>

  <body>
    <kbr-navigation></kbr-navigation>
    <!-- Theme Switcher - Fixed position in bottom left -->
    <kbr-theme-switcher></kbr-theme-switcher>

    <main class="blog-post-layout">
      <aside class="blog-toc-sidebar">
        <div class="blog-toc-sticky-container">
          {{#series}}
          <kbr-post-series
            series-name="{{series.name}}"
            current-part="{{series.part}}"
          >
          </kbr-post-series>
          {{/series}}
          <kbr-table-of-contents></kbr-table-of-contents>
          {{#tagsHtml}} {{{tagsHtml}}} {{/tagsHtml}}
        </div>
      </aside>

      <article class="blog-post-content glass-surface">
        {{{content}}} {{#citationsHtml}}
        <div class="blog-citations-container">{{{citationsHtml}}}</div>
        {{/citationsHtml}}

        <kbr-anchor-copy></kbr-anchor-copy>
      </article>
    </main>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
