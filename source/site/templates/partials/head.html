<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Theme bootstrap. Blocking on purpose, and kept first in <head>.

     The page background and the gradient band above the header come from
     --color-background and --gradient-primary, which only take their theme
     values inside [data-theme="base"] and [data-theme="canney-valley"].
     Those attributes used to be stamped by theme-switcher.ts in
     connectedCallback - after the Lit bundle parses - so the page painted
     once with the properties.css fallbacks and then visibly repainted.

     This mirrors THEME_STORAGE_KEY, COLOR_SCHEME_STORAGE_KEY, and
     DEFAULT_THEME in theme-constants.ts, as well as loadSavedTheme() in
     theme-switcher.ts. Keep the literals and constants in sync. See DF-13. -->
<script>
  (function () {
    var d = document.documentElement;
    try {
      d.setAttribute("data-theme", localStorage.getItem("kbr-theme") || "base");
      d.setAttribute(
        "data-color-scheme",
        localStorage.getItem("kbr-color-scheme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light")
      );
    } catch (e) {
      // localStorage throws in private mode with cookies disabled.
      d.setAttribute("data-theme", "base");
      d.setAttribute("data-color-scheme", "light");
    }
  })();
</script>
<!-- Root-absolute so it resolves from nested paths such as
     /<post>/supplements/<page>.html as well as from the site root. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>{{title}}</title>
<meta data-kbr-if="description" name="description" content="{{description}}" />
<meta data-kbr-if="keywords" name="keywords" content="{{keywords}}" />
<!-- Link previews (LinkedIn, Slack, Bluesky, etc.). Values come from
     socialMetadata() in source/builder/site-renderer.ts. The image source
     is scripts/og-image/og-default.html. -->
<meta property="og:site_name" content="Kyle Blank Rollins" />
<meta property="og:title" content="{{title}}" />
<meta data-kbr-if="description" property="og:description" content="{{description}}" />
<meta data-kbr-if="ogType" property="og:type" content="{{ogType}}" />
<meta data-kbr-if="pageUrl" property="og:url" content="{{pageUrl}}" />
<meta data-kbr-if="socialImage" property="og:image" content="{{socialImage}}" />
<meta data-kbr-if="socialImage" property="og:image:width" content="1200" />
<meta data-kbr-if="socialImage" property="og:image:height" content="630" />
<meta data-kbr-if="socialImage" property="og:image:alt" content="Kyle Blank Rollins: technical manager, technical writer, and developer." />
<meta name="twitter:card" content="summary_large_image" />
<template
  data-kbr-if="additionalHead"
  data-kbr-html="additionalHead"
></template>
