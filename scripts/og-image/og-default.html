<!doctype html>
<!-- Source for public/images/og-default.png, the social preview image that
     LinkedIn, Slack, etc. show when someone shares a link to the site.
     Mirrors the home page hero: gradient band, mono eyebrow, small-caps
     serif heading. Regenerate with scripts/og-image/render.sh. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: valkyrie_b_caps;
        font-weight: 700;
        src: url("../../public/fonts/valkyrie_b_caps_bold.woff2") format("woff2");
      }
      @font-face {
        font-family: valkyrie_b;
        font-weight: 400;
        src: url("../../public/fonts/valkyrie_b_regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        src: url("../../public/fonts/IBMPlexMono-Regular.woff2") format("woff2");
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        color: #0f172a;
      }
      .band {
        height: 24px;
        background: linear-gradient(135deg, #e2e8f0 0%, #3b82f6 100%);
      }
      .content {
        box-sizing: border-box;
        height: 606px;
        padding: 104px 96px 80px;
        display: flex;
        flex-direction: column;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 28px;
        color: #1e40af;
        margin: 0 0 28px;
      }
      h1 {
        font-family: valkyrie_b_caps, serif;
        font-weight: 700;
        font-size: 92px;
        white-space: nowrap;
        line-height: 1;
        margin: 0 0 32px;
        letter-spacing: -0.01em;
      }
      .lead {
        font-family: valkyrie_b, serif;
        font-size: 44px;
        line-height: 1.3;
        color: #475569;
        margin: 0;
        max-width: 1008px;
      }
      .url {
        margin-top: auto;
        font-family: "IBM Plex Mono", monospace;
        font-size: 26px;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="band"></div>
    <div class="content">
      <p class="eyebrow">Hello there!</p>
      <h1>Kyle Blank Rollins</h1>
      <p class="lead">Technical manager, technical writer, and developer.</p>
      <p class="url">kyleblankrollins.com</p>
    </div>
  </body>
</html>
